<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="stlye.css">
</head>

<body>

<div class="container">

  <!-- LEFT SIDE -->
  <div class="left">
      <img src="/i-m-zion-rVcxGBT80j8-unsplash.jpg" alt="Background">
      <div class="text-box">
          <p class="quote">
              “I chose to work for CrowdGen because I enjoy remote work and I get to learn more about AI. I can work whenever, 
              and I'm always watching for new projects.”
          </p>
          <p class="name">~ Felix, USA</p>
      </div>
  </div>

  <!-- RIGHT SIDE (FORM) -->
  <div class="right">
      <form action="submit">
        <h1>Login to your account</h1>

        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" required>

        <label for="email">Email / Phone Number</label>
        <input type="text" id="email" placeholder="Enter your Email" required>

        <label for="password">Enter Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>

        <a href="#" class="forgot">Forgot password?</a>

        <div class="checkbox-row">
          <input type="checkbox" id="agree" required>
          <label for="agree">Agree with our rules and policies</label>
        </div>

        <input type="submit" id="submit" value="Login">

        <div class="checkbox-row space">
          <input type="checkbox" id="remember" checked>
          <label for="remember">Remember me</label>
          <a href="#" class="help">Need help?</a>
        </div>

        <a href="#" class="create">Create a new account</a>
      </form>
  </div>

</div>

</body>
</html>
